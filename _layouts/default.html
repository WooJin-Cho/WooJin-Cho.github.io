<!DOCTYPE html>
<html lang="en">

  {% include head.html %}

  <body id="top">

    <div class="layout">
      {% include sidebar.html %}

      <div class="gauge" aria-hidden="true">
        <span class="gauge-target"></span>
        <span class="gauge-fill"></span>
        <span class="gauge-craft">
          <svg class="rocket" viewBox="0 0 32 32">
            <defs>
              <clipPath id="craft-side"><rect x="-8" y="-8" width="25" height="48"/></clipPath>
              <clipPath id="craft-main"><rect x="16" y="-8" width="24" height="48"/></clipPath>
              <g id="craft-rocket" fill="currentColor">
                <path fill-rule="evenodd" d="M16 3.5C20 7.5 21.6 12.5 21.6 17.5V22.6H10.4V17.5C10.4 12.5 12 7.5 16 3.5ZM16 10.7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 1 0 0-5Z"/>
                <path stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" d="M10.4 16.5 6 22.4V25.6H10.4ZM21.6 16.5 26 22.4V25.6H21.6Z"/>
              </g>
              <g id="craft-satellite" fill="currentColor" transform="rotate(-32 16 16)">
                <rect x="0.7" y="12.7" width="4.6" height="6.6" rx="0.9"/>
                <rect x="6.2" y="12.7" width="4.6" height="6.6" rx="0.9"/>
                <rect x="21.2" y="12.7" width="4.6" height="6.6" rx="0.9"/>
                <rect x="26.7" y="12.7" width="4.6" height="6.6" rx="0.9"/>
                <rect x="10.5" y="15.2" width="2" height="1.6"/>
                <rect x="19.5" y="15.2" width="2" height="1.6"/>
                <path fill-rule="evenodd" d="M13.8 11.7h4.4a1.6 1.6 0 0 1 1.6 1.6v5.4a1.6 1.6 0 0 1-1.6 1.6h-4.4a1.6 1.6 0 0 1-1.6-1.6v-5.4a1.6 1.6 0 0 1 1.6-1.6ZM16 14.4a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 1 0 0-3.2Z"/>
              </g>
            </defs>
            <use class="side" href="#craft-rocket" clip-path="url(#craft-side)"/>
            <use class="main" href="#craft-rocket" clip-path="url(#craft-main)"/>
            <path class="flame" d="M13.2 24.8H18.8L16 30Z"/>
          </svg>
          <svg class="satellite" viewBox="0 0 32 32">
            <use class="side" href="#craft-satellite" clip-path="url(#craft-side)"/>
            <use class="main" href="#craft-satellite" clip-path="url(#craft-main)"/>
          </svg>
        </span>
      </div>

      <main>
        <div class="content">
          {{ content }}
        </div>
      </main>
    </div>

    <script src="{{ '/public/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>

  </body>
</html>
