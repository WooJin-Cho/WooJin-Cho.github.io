<!DOCTYPE html>
<html lang="en">

  {% include head.html %}

  <body id="top">

    <div class="layout">
      {% include sidebar.html %}

      <div class="gauge" aria-hidden="true">
        <span class="gauge-fill"></span>
        <span class="gauge-craft">
          <svg class="rocket" viewBox="0 0 32 32">
            <defs>
              <g id="rocket-ink">
                <path d="M16 3.5C20 7.5 21.6 12.5 21.6 17.5V22.6H10.4V17.5C10.4 12.5 12 7.5 16 3.5Z"/>
                <path d="M10.4 16.5 6 22.4V25.6H10.4ZM21.6 16.5 26 22.4V25.6H21.6Z"/>
              </g>
              <g id="satellite-ink" transform="translate(0 1) rotate(45 16 15)">
                <rect x="1.5" y="11.5" width="8.5" height="7" rx="1"/>
                <rect x="22" y="11.5" width="8.5" height="7" rx="1"/>
                <rect x="9.6" y="14.2" width="2.8" height="1.6"/>
                <rect x="19.6" y="14.2" width="2.8" height="1.6"/>
                <rect x="12" y="11" width="8" height="8" rx="1.8"/>
                <rect x="14.5" y="18.6" width="3" height="3.2"/>
                <path d="M10.8 26.4a5.2 5.2 0 0 1 10.4 0Z"/>
                <path d="M14.5 26.2a1.5 1.5 0 0 0 3 0Z"/>
              </g>
              <g id="satellite-detail" transform="translate(0 1) rotate(45 16 15)">
                <circle cx="16" cy="15" r="1.7"/>
                <rect x="1.5" y="14.55" width="8.5" height="0.9"/>
                <rect x="5.3" y="11.5" width="0.9" height="7"/>
                <rect x="22" y="14.55" width="8.5" height="0.9"/>
                <rect x="25.8" y="11.5" width="0.9" height="7"/>
              </g>
            </defs>
            <use class="key" href="#rocket-ink"/>
            <use class="ink" href="#rocket-ink"/>
            <circle class="detail" cx="16" cy="13.2" r="2.5"/>
            <path class="flame" d="M13.2 24.8H18.8L16 30Z"/>
          </svg>
          <svg class="satellite" viewBox="0 0 32 32">
            <use class="key" href="#satellite-ink"/>
            <use class="ink" href="#satellite-ink"/>
            <use class="detail" href="#satellite-detail"/>
          </svg>
        </span>
      </div>

      <main>
        <div class="content">
          {{ content }}
        </div>
      </main>
    </div>

    <script src="{{ '/public/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>

  </body>
</html>
